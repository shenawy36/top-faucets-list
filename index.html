</head>
<body class="relative min-h-screen antialiased selection:bg-blue-500/30">

    <div class="glow-bg"></div>

    <!-- Header Section -->
    <header class="pt-20 pb-16 px-4 text-center border-b border-slate-800/60 bg-slate-900/20 backdrop-blur-md">
        <div class="inline-block mb-4 px-4 py-1.5 rounded-full border border-blue-500/30 bg-blue-500/10 text-blue-400 text-sm font-semibold tracking-wide">
            Updated & Verified for 2026
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-6 tracking-tight">
            Elite <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Crypto Rewards</span>
        </h1>
        <p class="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto leading-relaxed">
            A premium curation of the highest-paying, most reliable Faucet and PTC platforms. Tested daily for instant payouts.
        </p>
    </header>

    <main class="max-w-7xl mx-auto mt-16 px-4 sm:px-6 pb-24">

        <div class="mb-20">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-2 h-8 rounded-full bg-gradient-to-b from-blue-400 to-blue-600"></div>

            </div>
            <div id="faucets-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        </div>

        <!-- PTC Category -->

            </div>
            <div id="ptc-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- PTC cards inject here -->
            </div>
        </div>

    </main>

    <script>

        }

        const sites = [
            // ================= FAUCETS =================

                features: ["Instant FaucetPay Cashout", "Highest Market Rates", "Daily Claim Bonuses"]
            },
            { name: "FireFaucet", domain: "firefaucet.win", url: "https://firefaucet.win/ref/153489", type: "faucet", badge: "Trusted Leader", features: ["Auto Faucet System", "Level Progression", "Multiple Coins"] },
            { name: "VieFaucet", domain: "viefaucet.com", url: "https://viefaucet.com?r=682fcc8047fd0404ab18ca39", type: "faucet", badge: "Solid Performer", features: ["Instant Withdrawal", "PTC & Offerwalls", "Low Minimum"] },
            { name: "FaucetCrypto", domain: "faucetcrypto.com", url: "https://faucetcrypto.com/r/556693", type: "faucet", badge: "RPG Style", features: ["Direct Wallet Payout", "Level Up Elements", "20+ Crypto Assets"] },
            { name: "DutchyCorp", domain: "autofaucet.dutchycorp.space", url: "https://autofaucet.dutchycorp.space/?r=thekayser", type: "faucet", badge: "Massive Platform", features: ["70+ Cryptocurrencies", "Automated Claims", "Staking Rewards"] },
            { name: "AutoFaucet", domain: "autofaucet.org", url: "https://autofaucet.org/r/thekayser", type: "faucet", badge: "Reliable", features: ["Custom Mining Mode", "Instant Payouts", "Built-in Exchange"] },
            { name: "FaucetPay", domain: "faucetpay.io", url: "https://faucetpay.io/r/833226", type: "faucet", badge: "Essential Hub", features: ["Micro-Wallet Standard", "Built-in PTC Ads", "Swap & Trade"] },
            { name: "Cointiply", domain: "cointiply.mobi", url: "https://cointiply.mobi/pk76m", type: "faucet", badge: "Top Tier", features: ["High Earning Potential", "Interest on Balance", "Official Mobile App"] },
            { name: "EarnBitMoon", domain: "earnbitmoon.club", url: "https://earnbitmoon.club/?ref=91582", type: "faucet", badge: "Fast Claims", features: ["Claim Every 5 Mins", "Weekly Contests", "Fast Support"] },
            { name: "FreeSolana", domain: "freesolana.top", url: "https://freesolana.top/?r=160257", type: "faucet", badge: "Solana Focus", features: ["Pure SOL Rewards", "Minimalist UI", "Lightning Payouts"] },
            { name: "Aruble", domain: "aruble.net", url: "https://aruble.net/?ref=88B2894935", type: "faucet", badge: "Trending", features: ["FaucetPay Integration", "Micro Tasks", "Multi-Coin Support"] },
            { name: "Faucet Gold", domain: "faucet.gold", url: "https://faucet.gold/r/25143", type: "faucet", badge: "Verified", features: ["Gold Standard Rewards", "Crypto Exchange", "Instant Deliveries"] },
            { name: "Coin101Coin", domain: "coin101coin.com", url: "https://coin101coin.com/register.php?ref=02F2C0A8", type: "faucet", badge: "Steady Income", features: ["Classic Faucet Layout", "High-Paying Offers", "PTC Ads Included"] },
            
            // ================= PTC SITES =================
            { name: "RewardJoy", domain: "rewardjoy.com", url: "https://www.rewardjoy.com/?r=thekayser", type: "ptc", badge: "Easy Tasks", features: ["View Quick Ads", "High Reward Rates", "Fast Cashout"] },
            { name: "FaucetPayz", domain: "faucetpayz.com", url: "https://faucetpayz.com/ref/thekayser", type: "ptc", badge: "Direct FP", features: ["FaucetPay Linked", "Simple Click Flow", "Low Limits"] },
            { name: "adBTC", domain: "adbtc.top", url: "https://r.adbtc.top/3712530", type: "ptc", badge: "Best for BTC", features: ["Surf for Satoshis", "Active Ad Market", "Highly Reliable"] },
            { name: "BTCAdSpace", domain: "btcadspace.com", url: "https://btcadspace.com/ref/thekayser", type: "ptc", badge: "Paying Daily", features: ["Premium Ads", "Revenue Share System", "Bitcoin Payouts"] }
        ];

        const faucetsContainer = document.getElementById('faucets-container');
        const ptcContainer = document.getElementById('ptc-container');

        sites.forEach(site => {
            const logoUrl = `https://www.google.com/s2/favicons?domain=${site.domain}&sz=128`;
            
            // تصميم كارت موقعك بلمسة فاخرة (ذهبي/أزرق متوهج)
            const cardClass = site.highlight 
                ? "bg-[#131B2C] border border-blue-500/50 shadow-[0_0_30px_rgba(59,130,246,0.15)] transform hover:-translate-y-1.5 z-10" 
                : "bg-[#111827] border border-slate-800 hover:border-slate-600 hover:bg-[#161f33] transform hover:-translate-y-1";
            
            const badgeClass = site.highlight
                ? "bg-gradient-to-r from-amber-500 to-orange-400 text-white shadow-[0_0_10px_rgba(245,158,11,0.3)]"
                : "bg-slate-800 text-slate-300 border border-slate-700";

            const btnClass = site.highlight
                ? "bg-gradient-to-r from-blue-600 to-emerald-500 hover:from-blue-500 hover:to-emerald-400 text-white shadow-lg shadow-blue-500/25"
                : "bg-slate-800 hover:bg-slate-700 text-white border border-slate-700";

            // أيقونة صح احترافية
            const checkIcon = `<svg class="w-4 h-4 text-emerald-400 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>`;

            const cardHTML = `
                <div class="rounded-2xl transition-all duration-300 p-6 flex flex-col h-full relative overflow-hidden ${cardClass}">
                    ${site.highlight ? '<div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>' : ''}
                    
                    <div class="flex items-start justify-between mb-5 relative z-10">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-white/5 p-2 border border-slate-700/50 flex items-center justify-center backdrop-blur-sm">
                                <img src="${logoUrl}" alt="${site.name}" class="w-full h-full object-contain rounded-md" loading="lazy">
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-white mb-1">${site.name}</h3>
                                <span class="text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider ${badgeClass}">${site.badge}</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex-grow relative z-10">
                        <ul class="space-y-3 mb-6">
                            ${site.features.map(f => `
                                <li class="flex items-start gap-2 text-sm text-slate-300 font-medium">
                                    ${checkIcon}
                                    <span>${f}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <div class="mt-auto relative z-10">
                        <button onclick="openLink('${site.url}')" class="w-full font-semibold py-3 px-4 rounded-xl transition-all duration-300 ${btnClass}">
                            Access Platform
                        </button>
                    </div>
                </div>
            `;

            if (site.type === 'faucet') {
                faucetsContainer.innerHTML += cardHTML;
            } else {
                ptcContainer.innerHTML += cardHTML;
            }
        });
    </script>
</body>
</html>
