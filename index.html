        sites.forEach(site => {

            // تصميم كارت موقعك المميز مقابل المواقع الأخرى
            const cardStyle = site.highlight 
                ? "bg-indigo-50 border-2 border-indigo-500 shadow-md scale-105 transform hover:-translate-y-1 relative" 
                : "bg-white border border-gray-200 shadow-sm hover:shadow-lg hover:-translate-y-1";

                ? "bg-indigo-600 text-white"
                : "bg-green-100 text-green-800";

            const btnStyle = site.highlight
                ? "bg-indigo-600 hover:bg-indigo-700 shadow-lg shadow-indigo-500/30 text-white"
                : "bg-slate-800 hover:bg-slate-900 text-white";

            const cardHTML = `
                <div class="rounded-xl transition-all duration-300 p-6 ${cardStyle}">

                            <h3 class="text-xl font-bold text-gray-900">${site.name}</h3>
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full uppercase tracking-wide ${badgeStyle}">${site.badge}</span>
                        </div>
                    </div>
                    <ul class="text-gray-600 mb-6 space-y-2 text-sm ml-1">
                        ${site.features.map(f => `<li><span class="text-green-500 mr-2">✓</span>${f}</li>`).join('')}
                    </ul>
                    <!-- الزر يستدعي دالة JavaScript لفتح الرابط بدون إظهاره -->
                    <button onclick="openLink('${site.url}')" class="w-full font-semibold py-2.5 px-4 rounded-lg transition-colors duration-200 ${btnStyle}">
                        Start Earning Now
                    </button>
                </div>
            `;

            if (site.type === 'faucet') {
                faucetsContainer.innerHTML += cardHTML;
            } else {
                ptcContainer.innerHTML += cardHTML;
            }
